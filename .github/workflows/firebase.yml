# Deploys the Cloud Function and Firestore rules on every push that changes them.
# Needs one thing in the repo settings:
#   Secret   FIREBASE_SERVICE_ACCOUNT  – the JSON key of the deploy service account
name: Deploy Firebase backend

on:
  push:
    branches: [main]
    paths: ["functions/**", "scripts/**", "firestore.rules", "firestore.indexes.json", "firebase.json", ".github/workflows/firebase.yml"]
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT_ID: williamrech-firebase
    steps:
      - name: Check setup
        id: check
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set yet — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install function dependencies
        if: steps.check.outputs.ready == 'true'
        run: npm install --omit=dev
        working-directory: functions

      - name: Stamp backend build (shown in Admin → Backend)
        if: steps.check.outputs.ready == 'true'
        run: echo "{\"sha\":\"${GITHUB_SHA::8}\",\"at\":$(date +%s)000}" > functions/build.json

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project "$PROJECT_ID" \
            --non-interactive --force
          # Auto-delete old function build images so they don't slowly add storage cost.
          npx --yes firebase-tools@latest functions:artifacts:setpolicy \
            --project "$PROJECT_ID" --location us-central1 --days 7 --force --non-interactive || true

      - name: Let the functions read usage numbers (Monitoring Viewer), if this account may grant it
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          echo "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          NUM=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${NUM}-compute@developer.gserviceaccount.com" \
            --role="roles/monitoring.viewer" --condition=None --quiet --format=none \
            && echo "MONITORING_GRANT=ok" || echo "MONITORING_GRANT=denied"

      - name: Seed fun content (only if missing)
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" NODE_PATH=functions/node_modules node scripts/seed-fun.js
