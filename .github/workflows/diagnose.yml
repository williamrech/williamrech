# Temporary: checks which account the deploy key belongs to and what it can do.
name: Diagnose deploy key
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Key identity
        run: |
          echo "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "client_email: $(jq -r .client_email "$RUNNER_TEMP/sa.json" | sed 's/@/ AT /')"
          echo "project_id:   $(jq -r .project_id "$RUNNER_TEMP/sa.json")"
      - name: Roles granted on project
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q
          EMAIL=$(jq -r .client_email "$RUNNER_TEMP/sa.json")
          gcloud projects get-iam-policy williamrech-firebase --flatten="bindings[].members" \
            --filter="bindings.members:serviceAccount:$EMAIL" --format="value(bindings.role)" || echo "cannot read IAM policy"
          echo "--- enabled services test:"
          gcloud services list --enabled --project williamrech-firebase --limit 5 || echo "cannot list services"
